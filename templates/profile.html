<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ویزیت {{ user[1] }}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <div class="card-header">
                <div class="avatar">
                    {% if user[2] %}
                        <img src="/static/uploads/{{ user[2] }}" alt="لوگو">
                    {% else %}
                        <span>👤</span>
                    {% endif %}
                </div>
                <h1>{{ user[1] }}</h1>
                <p class="job-title">{{ user[3] or 'عنوان شغلی' }}</p>
            </div>
            <div class="card-body">
                <p class="description">{{ user[4] or 'توضیحات' }}</p>
                <div class="info-list">
                    {% if user[5] %}
                    <div class="info-item">
                        <span class="icon">📞</span>
                        <span>{{ user[5] }}</span>
                    </div>
                    {% endif %}
                    {% if user[6] %}
                    <div class="info-item">
                        <span class="icon">✉️</span>
                        <span>{{ user[6] }}</span>
                    </div>
                    {% endif %}
                    {% if user[7] %}
                    <div class="info-item">
                        <span class="icon">🌐</span>
                        <span>{{ user[7] }}</span>
                    </div>
                    {% endif %}
                </div>
            </div>
            <div class="card-footer">
                <span>📱 کارت ویزیت هوشمند</span>
            </div>
        </div>
    </div>
</body>
</html>
