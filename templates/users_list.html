<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست کارت ویزیت‌ها</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-container">
        <div class="card" style="text-align: center;">
            <h2>📇 لیست کارت ویزیت‌های هوشمند</h2>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
                {% if users %}
                    {% for user in users %}
                    <a href="/profile/{{ user['id'] }}" target="_blank" style="display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 16px; text-decoration: none; color: white; transition: background 0.3s; border: 1px solid rgba(255,255,255,0.05);">
                        <div style="width: 50px; height: 50px; border-radius: 50%; overflow: hidden; background: #333; flex-shrink: 0;">
                            {% if user['logo'] %}
                                <img src="/static/uploads/{{ user['logo'] }}" style="width: 100%; height: 100%; object-fit: cover;">
                            {% else %}
                                <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-size: 24px; color: #aaa;">👤</div>
                            {% endif %}
                        </div>
                        <div style="text-align: right; flex: 1;">
                            <div style="font-weight: bold; font-size: 16px;">{{ user['name'] }}</div>
                            <div style="font-size: 13px; color: #aaa;">{{ user['job_title'] or 'بدون عنوان' }}</div>
                        </div>
                        <div style="color: #667eea;">👈</div>
                    </a>
                    {% endfor %}
                {% else %}
                    <p style="color: #aaa;">هیچ کارت ویزیت تایید شده‌ای وجود ندارد.</p>
                {% endif %}
            </div>
            <a href="/" style="display: inline-block; margin-top: 25px; color: #a0aec0;">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
