<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h2 style="text-align: center;">📝 ثبت‌نام</h2>
            <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="text" name="name" placeholder="نام کامل" required style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="email" name="email" placeholder="ایمیل" required style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="password" name="password" placeholder="رمز عبور" required style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <button type="submit" style="background: linear-gradient(135deg, #00b09b, #96c93d); color: white; padding: 14px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;">ثبت‌نام</button>
            </form>
            <p style="text-align: center; margin-top: 15px;"><a href="/login" style="color: #a0aec0;">قبلاً ثبت‌نام کردی؟ وارد شو</a></p>
            <a href="/" style="display: block; text-align: center; margin-top: 10px; color: #a0aec0;">بازگشت</a>
        </div>
    </div>
</body>
</html>
