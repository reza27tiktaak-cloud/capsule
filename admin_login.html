<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود ادمین</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Vazir&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazir', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0a;
            padding: 20px;
        }
        .container { max-width: 420px; width: 100%; }
        .card {
            background: rgba(255,255,255,0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(212,175,55,0.1);
            border-radius: 40px;
            padding: 45px 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            text-align: center;
            color: white;
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 5px;
        }
        .sub-logo { color: rgba(255,255,255,0.2); font-size: 12px; letter-spacing: 4px; margin-bottom: 30px; }
        .form-group { margin-bottom: 18px; text-align: right; }
        .form-group label { display: block; color: #aaa; font-size: 13px; margin-bottom: 5px; }
        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03);
            color: white;
            font-family: 'Vazir', Tahoma, sans-serif;
            backdrop-filter: blur(10px);
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #d4af37;
        }
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #d4af37, #b8962e);
            color: #0a0a0a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s;
            font-family: 'Vazir', Tahoma, sans-serif;
        }
        .btn:hover { transform: scale(1.02); }
        .back-link {
            display: block;
            margin-top: 20px;
            color: rgba(255,255,255,0.2);
            text-decoration: none;
            font-size: 13px;
        }
        .back-link:hover { color: rgba(255,255,255,0.4); }
        .flash-message {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .flash-danger { background: rgba(235, 51, 73, 0.1); border: 1px solid rgba(235, 51, 73, 0.2); color: #eb3349; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">MAHDAVI</div>
            <div class="sub-logo">— پنل مدیریت —</div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>👤 نام کاربری</label>
                    <input type="text" name="username" placeholder="نام کاربری" required>
                </div>
                <div class="form-group">
                    <label>🔒 رمز عبور</label>
                    <input type="password" name="password" placeholder="رمز عبور" required>
                </div>
                <button type="submit" class="btn">🔐 ورود به پنل</button>
            </form>
            <a href="/" class="back-link">← بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
