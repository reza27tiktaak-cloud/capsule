<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت گالری</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h2 style="text-align: center;">🖼️ مدیریت گالری</h2>
            <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="file" name="images" accept="image/*" multiple style="color: white;">
                <button type="submit" style="background: linear-gradient(135deg, #00b09b, #96c93d); color: white; padding: 14px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer;">آپلود عکس‌ها</button>
            </form>
            <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin-top: 20px;">
                {% for image in images %}
                <div style="position: relative;">
                    <img src="/static/uploads/{{ image[2] }}" style="width: 100%; height: 100px; object-fit: cover; border-radius: 10px;">
                    <a href="/delete_gallery/{{ image[0] }}" style="position: absolute; top: 5px; right: 5px; background: red; color: white; border-radius: 50%; width: 25px; height: 25px; text-align: center; text-decoration: none; line-height: 25px;">×</a>
                </div>
                {% endfor %}
            </div>
            <a href="/dashboard" style="display: block; text-align: center; margin-top: 15px; color: #a0aec0;">بازگشت به داشبورد</a>
        </div>
    </div>
</body>
</html>
