{% extends "base.html" %}

{% block title %}کپسول | کارت ویزیت هوشمند{% endblock %}

{% block content %}

<!-- ===== کارت اصلی شیشه‌ای ===== -->
<div class="glass-card" id="glassCard">
    <!-- هدر متحرک -->
    <div class="animated-header">
        <img src="/static/logo.png" alt="کپسول">
        <div class="overlay"></div>
    </div>

    <!-- پروفایل سه‌بعدی -->
    <div class="profile-wrapper" id="profileWrapper">
        <div class="profile-image" id="profileImage">
            <img src="/static/logo.png" alt="پروفایل">
        </div>
    </div>

    <h1>کپسول</h1>
    <div class="sub">— کارت ویزیت هوشمند —</div>

    <div class="btn-group">
        <a href="/login" class="btn btn-primary">🔐 ورود به پنل</a>
        <a href="/register" class="btn">📝 ثبت‌نام جدید</a>
        <a href="/users" class="btn">📇 مشاهده کارت‌ها</a>
    </div>

    <div class="phone-wrapper">
        <a href="tel:09199844594" class="phone-number" id="phoneNumber">
            <span id="phoneDisplay"></span><span class="cursor" id="cursor"></span>
        </a>
    </div>

    <div class="footer-text">کارت ویزیت هوشمند • همیشه در دسترس</div>
</div>

<style>
    /* ==============================================
       کارت شیشه‌ای
       ============================================== */
    .glass-card {
        position: relative;
        padding: 25px 20px 30px;
        border-radius: 40px;
        background: rgba(20, 20, 35, 0.10);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        border: 1px solid rgba(255, 255, 255, 0.02);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
        overflow: hidden;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
        will-change: transform;
        margin-top: 10px;
    }
    .glass-card::before {
        content: '';
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border-radius: 42px;
        background: conic-gradient(from 0deg, #d4af37, #b8962e, #8a6d1b, #d4af37, #b8962e, #d4af37);
        background-size: 300% 300%;
        z-index: -1;
        animation: neonBorder 5s linear infinite;
        filter: blur(2px);
        opacity: 0.5;
    }
    @keyframes neonBorder {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .glass-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 40px;
        background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), 
                    rgba(255, 255, 255, 0.02), 
                    transparent 60%);
        pointer-events: none;
        z-index: 0;
    }

    .animated-header {
        width: 100%;
        height: 120px;
        border-radius: 25px;
        overflow: hidden;
        margin-bottom: 15px;
        position: relative;
        z-index: 1;
        border: 1px solid rgba(255, 255, 255, 0.02);
    }
    .animated-header img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }
    .animated-header .overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(212, 175, 55, 0.03), transparent 60%);
        pointer-events: none;
    }

    .profile-wrapper {
        position: relative;
        width: 120px;
        height: 120px;
        margin: 0 auto 15px;
        z-index: 2;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
        will-change: transform;
    }
    .profile-wrapper::before {
        content: '';
        position: absolute;
        top: -6px;
        left: -6px;
        right: -6px;
        bottom: -6px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent, #d4af37, transparent, #b8962e, transparent);
        background-size: 300% 300%;
        animation: ringSpin 4s linear infinite;
        filter: blur(1px);
        opacity: 0.4;
        z-index: -1;
    }
    @keyframes ringSpin {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    .profile-image {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(212, 175, 55, 0.1);
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.03);
        background: rgba(20, 20, 35, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .profile-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 34px;
        color: #1a1a2e;
        margin-bottom: 2px;
        letter-spacing: 2px;
        position: relative;
        z-index: 1;
    }
    .sub {
        color: rgba(26, 26, 46, 0.25);
        font-size: 12px;
        letter-spacing: 5px;
        margin-bottom: 18px;
        position: relative;
        z-index: 1;
    }

    .btn-group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin: 15px 0 18px;
        position: relative;
        z-index: 1;
    }
    .btn {
        display: block;
        padding: 14px;
        border-radius: 60px;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        font-family: 'Vazir', Tahoma, sans-serif;
        text-align: center;
        background: rgba(20, 20, 35, 0.06);
        backdrop-filter: blur(10px);
        color: #1a1a2e;
        border: 1px solid rgba(212, 175, 55, 0.04);
    }
    .btn:hover {
        background: rgba(20, 20, 35, 0.12);
        transform: scale(1.02) translateY(-2px);
        border-color: rgba(212, 175, 55, 0.1);
    }
    .btn-primary {
        background: linear-gradient(135deg, #d4af37, #b8962e);
        color: #0a0a0a;
        border: none;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.04);
    }
    .btn-primary:hover {
        transform: scale(1.02) translateY(-2px);
        box-shadow: 0 8px 30px rgba(212, 175, 55, 0.08);
    }

    .phone-wrapper {
        position: relative;
        z-index: 1;
        min-height: 55px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .phone-number {
        font-family: 'Playfair Display', serif;
        font-size: 24px;
        font-weight: 700;
        color: #1a1a2e;
        text-decoration: none;
        padding: 10px 22px;
        border-radius: 60px;
        background: rgba(20, 20, 35, 0.04);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(212, 175, 55, 0.03);
        transition: all 0.4s ease;
    }
    .phone-number:hover {
        transform: scale(1.02);
        background: rgba(20, 20, 35, 0.08);
    }
    .cursor {
        display: inline-block;
        width: 2px;
        height: 26px;
        background: #1a1a2e;
        margin-right: 3px;
        animation: blink 0.7s step-end infinite;
        vertical-align: middle;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

    .footer-text {
        color: rgba(26, 26, 46, 0.04);
        font-size: 10px;
        letter-spacing: 2px;
        margin-top: 15px;
        position: relative;
        z-index: 1;
    }

    @media (max-width: 480px) {
        .glass-card { padding: 20px 15px 25px; }
        .animated-header { height: 90px; }
        .profile-wrapper { width: 100px; height: 100px; }
        h1 { font-size: 28px; }
        .phone-number { font-size: 20px; padding: 8px 18px; }
        .btn { font-size: 13px; padding: 13px; }
        .cursor { height: 22px; }
    }
</style>

{% block extra_js %}
<script>
    // ===== افکت انعکاس نور =====
    const card = document.getElementById('glassCard');
    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        card.style.setProperty('--mouse-x', ((e.clientX - rect.left) / rect.width * 100) + '%');
        card.style.setProperty('--mouse-y', ((e.clientY - rect.top) / rect.height * 100) + '%');
    });
    card.addEventListener('mouseleave', () => {
        card.style.setProperty('--mouse-x', '50%');
        card.style.setProperty('--mouse-y', '50%');
    });

    // ===== چرخش سه‌بعدی =====
    const container = document.querySelector('.container');
    let mouseX = 0, mouseY = 0;
    let targetRotateX = 0, targetRotateY = 0;

    document.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        mouseX = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
        mouseY = ((e.clientY - rect.top) / rect.height - 0.5) * 2;
    });
    document.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        if (touch) {
            const rect = container.getBoundingClientRect();
            mouseX = ((touch.clientX - rect.left) / rect.width - 0.5) * 2;
            mouseY = ((touch.clientY - rect.top) / rect.height - 0.5) * 2;
        }
    }, { passive: true });

    function animate3D() {
        targetRotateX += (mouseY * 12 - targetRotateX) * 0.08;
        targetRotateY += (mouseX * -12 - targetRotateY) * 0.08;
        card.style.transform = `rotateX(${targetRotateX}deg) rotateY(${targetRotateY}deg) scale(1.01)`;
        const profile = document.getElementById('profileWrapper');
        if (profile) {
            profile.style.transform = `rotateX(${mouseY * 6}deg) rotateY(${mouseX * -6}deg) translateZ(5px)`;
        }
        requestAnimationFrame(animate3D);
    }
    animate3D();

    // ===== تایپینگ شماره =====
    const phoneText = "📞 ۰۹۱۹۹۸۴۴۵۹۴";
    const display = document.getElementById('phoneDisplay');
    const cursor = document.getElementById('cursor');
    let index = 0, isDeleting = false;

    function typeEffect() {
        if (!isDeleting) {
            if (index < phoneText.length) {
                display.textContent = phoneText.slice(0, index + 1);
                index++;
                setTimeout(typeEffect, 70);
            } else {
                isDeleting = true;
                setTimeout(typeEffect, 2500);
            }
        } else {
            if (index > 0) {
                display.textContent = phoneText.slice(0, index - 1);
                index--;
                setTimeout(typeEffect, 35);
            } else {
                isDeleting = false;
                setTimeout(typeEffect, 500);
            }
        }
    }
    setTimeout(typeEffect, 600);
</script>
{% endblock %}
