<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گالری تصاویر {{ user['name'] }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Vazir', Tahoma, sans-serif; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gallery-container {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(145deg, #111, #1a1a1a);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .gallery-title {
            color: #d4af37;
            text-align: center;
            font-size: 28px;
            margin-bottom: 10px;
            font-family: 'Playfair Display', serif;
        }
        .gallery-sub {
            color: #b8a88a;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .gallery-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .gallery-grid img:hover {
            transform: scale(1.03);
            border-color: #d4af37;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }
        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: #b8a88a;
            text-decoration: none;
            transition: color 0.3s;
            text-align: center;
            padding: 12px 30px;
            border-radius: 50px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .back-link:hover {
            color: #d4af37;
            border-color: rgba(212, 175, 55, 0.3);
        }
        .no-image {
            color: #666;
            text-align: center;
            padding: 40px;
            font-size: 16px;
        }
        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); }
            .gallery-grid img { height: 150px; }
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <h1 class="gallery-title">🖼️ گالری تصاویر</h1>
        <p class="gallery-sub">{{ user['name'] }}</p>

        {% if images %}
        <div class="gallery-grid">
            {% for img in images %}
            <img src="/static/uploads/{{ img['image_path'] }}" alt="تصویر گالری">
            {% endfor %}
        </div>
        {% else %}
        <div class="no-image">⛔ هنوز عکسی در گالری وجود ندارد.</div>
        {% endif %}

        <div style="text-align: center;">
            <a href="/profile/{{ user['id'] }}" class="back-link">← بازگشت به کارت ویزیت</a>
        </div>
    </div>
</body>
</html>
