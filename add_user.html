<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت کارت جدید</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Vazir&display=swap" rel="stylesheet">
</head>
<body>
    <div class="card-container">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 20px;">ثبت کارت ویزیت جدید</h2>
            <form method="POST" enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 12px;">
                <input type="text" name="name" placeholder="نام کامل" required style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="text" name="job_title" placeholder="عنوان شغلی" style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <textarea name="description" placeholder="توضیحات" style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px); min-height: 80px;"></textarea>
                <input type="text" name="phone" placeholder="شماره تماس" style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="email" name="email" placeholder="ایمیل" style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="url" name="website" placeholder="وبسایت" style="padding: 12px; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: white; backdrop-filter: blur(10px);">
                <input type="file" name="logo" accept="image/*" style="color: white;">
                <button type="submit" style="background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 14px; border: none; border-radius: 50px; font-weight: bold; cursor: pointer; transition: transform 0.2s;">ثبت کارت</button>
            </form>
            <a href="/" style="display: block; text-align: center; margin-top: 20px; color: #a0aec0;">بازگشت به صفحه اصلی</a>
        </div>
    </div>
</body>
</html>
