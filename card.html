<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کارت ویزیت {{ user[1] }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover { transform: scale(1.02); }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;
        }
        h1 { color: #333; font-size: 24px; margin-bottom: 5px; }
        .job { color: #667eea; font-size: 16px; margin-bottom: 15px; }
        .desc { color: #666; font-size: 14px; line-height: 1.8; margin-bottom: 20px; }
        .info { text-align: right; margin-top: 20px; }
        .info-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }
        .info-item:last-child { border-bottom: none; }
        .info-item .icon { font-size: 20px; width: 30px; }
        .info-item a { color: #667eea; text-decoration: none; }
        .info-item a:hover { text-decoration: underline; }
        .nfc-badge {
            margin-top: 25px;
            background: #f0f0ff;
            padding: 12px;
            border-radius: 15px;
            color: #667eea;
            font-size: 14px;
        }
        @media (max-width: 480px) {
            .card { padding: 25px 20px; }
            .logo { width: 90px; height: 90px; }
        }
    </style>
</head>
<body>
    <div class="card">
        {% if user[2] %}
            <img class="logo" src="/static/uploads/{{ user[2] }}" alt="لوگو">
        {% else %}
            <div class="logo" style="background: #eee; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #999;">👤</div>
        {% endif %}
        
        <h1>{{ user[1] }}</h1>
        <div class="job">{{ user[3] or 'عنوان شغلی' }}</div>
        <div class="desc">{{ user[4] or 'توضیحات' }}</div>
        
        <div class="info">
            {% if user[5] %}
            <div class="info-item">
                <span class="icon">📞</span>
                <span>{{ user[5] }}</span>
            </div>
            {% endif %}
            {% if user[6] %}
            <div class="info-item">
                <span class="icon">✉️</span>
                <a href="mailto:{{ user[6] }}">{{ user[6] }}</a>
            </div>
            {% endif %}
            {% if user[7] %}
            <div class="info-item">
                <span class="icon">🌐</span>
                <a href="{{ user[7] }}" target="_blank">{{ user[7] }}</a>
            </div>
            {% endif %}
        </div>
        
        <div class="nfc-badge">
            📱 برای ذخیره، گوشی را به NFC نزدیک کنید
        </div>
    </div>
</body>
</html>
